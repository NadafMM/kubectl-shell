name: e2e-minikube

# Optional manual smoke against minikube (slow). Kind is the default e2e on every PR.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  minikube:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: medyagh/setup-minikube@v0.0.21
        with:
          minikube-version: v1.34.0
          kubernetes-version: v1.31.0
      - run: go build -o bin/kube ./cmd/kube
      - run: kubectl cluster-info
      - run: node scripts/e2e-kind.mjs
