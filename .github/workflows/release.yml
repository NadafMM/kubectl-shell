name: release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  github-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: go test ./cmd/kube ./internal/kube
      - run: node scripts/package-release.mjs
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/kubectl-shell-*.tar.gz

  homebrew-tap:
    needs: github-release
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.gate.outputs.enabled }}
    steps:
      - id: gate
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -n "${HOMEBREW_TAP_TOKEN:-}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "HOMEBREW_TAP_TOKEN not set; skipping tap bump."
          fi
      - uses: actions/checkout@v7
        if: steps.gate.outputs.enabled == 'true'
      - uses: actions/setup-node@v7
        if: steps.gate.outputs.enabled == 'true'
        with:
          node-version: 22
      - uses: actions/checkout@v7
        if: steps.gate.outputs.enabled == 'true'
        with:
          repository: NadafMM/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap
      - name: Render formula
        if: steps.gate.outputs.enabled == 'true'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          curl -fsSL "https://github.com/NadafMM/kubectl-shell/archive/refs/tags/${GITHUB_REF_NAME}.tar.gz" -o /tmp/kubectl-shell-src.tgz
          SHA="$(sha256sum /tmp/kubectl-shell-src.tgz | cut -d' ' -f1)"
          node scripts/render-formula.mjs "${VERSION}" "${SHA}" > tap/Formula/kubectl-shell.rb
      - name: Commit and push tap
        if: steps.gate.outputs.enabled == 'true'
        working-directory: tap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/kubectl-shell.rb
          git commit -m "kubectl-shell ${GITHUB_REF_NAME#v}"
          git push

  brew-smoke:
    needs: homebrew-tap
    if: needs.homebrew-tap.outputs.enabled == 'true'
    runs-on: macos-latest
    steps:
      - run: brew install NadafMM/tap/kubectl-shell && brew test kubectl-shell && kube --version
