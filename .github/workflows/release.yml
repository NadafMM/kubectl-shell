name: release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  github-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      sha256: ${{ steps.pkg.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: git diff --exit-code -- cli/kube.cjs
      - run: npm test
      - id: pkg
        run: node scripts/package-release.mjs >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            ${{ steps.pkg.outputs.path }}
            cli/kube.cjs

  homebrew-tap:
    needs: github-release
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.gate.outputs.enabled }}
    steps:
      - id: gate
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -n "${HOMEBREW_TAP_TOKEN:-}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "HOMEBREW_TAP_TOKEN not set; skipping tap bump."
          fi
      - uses: actions/checkout@v7
        if: steps.gate.outputs.enabled == 'true'
      - uses: actions/setup-node@v7
        if: steps.gate.outputs.enabled == 'true'
        with:
          node-version: 22
      - uses: actions/checkout@v7
        if: steps.gate.outputs.enabled == 'true'
        with:
          repository: NadafMM/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap
      - name: Render formula
        if: steps.gate.outputs.enabled == 'true'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node scripts/render-formula.mjs "${VERSION}" "${{ needs.github-release.outputs.sha256 }}" > tap/Formula/kubectl-shell.rb
      - name: Commit and push tap
        if: steps.gate.outputs.enabled == 'true'
        working-directory: tap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/kubectl-shell.rb
          git commit -m "kubectl-shell ${GITHUB_REF_NAME#v}"
          git push

  brew-smoke:
    needs: homebrew-tap
    if: needs.homebrew-tap.outputs.enabled == 'true'
    runs-on: macos-latest
    steps:
      - run: brew install NadafMM/tap/kubectl-shell && brew test kubectl-shell && kube --version
