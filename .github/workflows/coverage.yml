name: coverage

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Branch protection still requires a job named "coverage".
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Go tests with coverage
        # Cover packages that have tests; the parent internal/kube package is
        # types-only (no _test.go) and can trip a missing covdata tool on merge.
        run: |
          pkgs=$(go list ./cmd/kube ./internal/kube/... | grep -v 'internal/kube$')
          go test $pkgs -coverprofile=coverage.out -covermode=atomic
          go tool cover -func=coverage.out | tail -1
