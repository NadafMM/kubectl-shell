name: e2e-kind

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-kind-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kind:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: helm/kind-action@v1
        with:
          cluster_name: kube-shell-ci
      - run: npm ci
      - run: npm run build
      - run: kubectl cluster-info
      - run: npm run e2e:kind
