name: e2e-kind

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-kind-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kind:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: helm/kind-action@v1
        with:
          cluster_name: kube-shell-ci
      - run: go build -o bin/kube ./cmd/kube
      - run: kubectl cluster-info
      - run: node scripts/e2e-kind.mjs
