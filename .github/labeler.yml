go:
  - changed-files:
      - any-glob-to-any-file:
          - cmd/**
          - internal/**
          - go.mod
          - go.sum

javascript:
  - changed-files:
      - any-glob-to-any-file:
          - scripts/**

github_actions:
  - changed-files:
      - any-glob-to-any-file: .github/**

documentation:
  - changed-files:
      - any-glob-to-any-file:
          - README.md
          - docs/**
          - "*.md"
